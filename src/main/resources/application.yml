spring:
  threads:
    virtual:
      enabled: true

  application:
    name: walletcore

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/walletcore}
    username: ${DB_USERNAME:walletcore}
    password: ${DB_PASSWORD:walletcore_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:walletcore}
    password: ${RABBITMQ_PASSWORD:walletcore_secret}
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: false  # manual retry via @RabbitListener + Spring Retry

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:walletcore_secret}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutes

  batch:
    job:
      enabled: false  # jobs são disparados via scheduler, não no startup
    jdbc:
      initialize-schema: never  # Flyway cuida do schema do batch

security:
  jwt:
    # Sem default de propósito: uma chave de assinatura commitada é uma chave pública.
    # A aplicação não sobe sem JWT_SECRET (mínimo 32 caracteres, validado em JwtProperties).
    # Gere a sua com: openssl rand -hex 32
    secret: ${JWT_SECRET:}
    access-token-expiration: 900000       # 15 minutos em ms
    refresh-token-expiration: 604800000   # 7 dias em ms

walletcore:
  rabbitmq:
    exchange: walletcore.exchange
    queues:
      notification: walletcore.notification
      notification-dlq: walletcore.notification.dlq
    routing-keys:
      notification: notification.created
  rate-limit:
    transfer:
      capacity: 10
      refill-tokens: 10
      refill-duration-minutes: 1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    disable-swagger-default-url: true

spring.jackson:
  serialization:
    write-dates-as-timestamps: false
  deserialization:
    fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.walletcore: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: test

  # datasource url/username/password vêm do @DynamicPropertySource de AbstractIntegrationTest,
  # apontando para o container PostgreSQL real. O driver é inferido da URL jdbc:postgresql://...

  flyway:
    locations: classpath:db/migration
    clean-on-validation-error: true

  rabbitmq:
    host: localhost  # sobrescrito via @DynamicPropertySource nos testes

  data:
    redis:
      host: localhost  # sobrescrito via @DynamicPropertySource nos testes
      password: ""     # o Redis de teste sobe sem senha

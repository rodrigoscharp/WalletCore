spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

security:
  jwt:
    # Valor fixo só para os testes, deliberadamente sem cara de segredo real: a suíte precisa de
    # uma chave determinística e nenhum token daqui vale fora do perfil de teste.
    secret: "test-only-signing-key-not-a-secret-do-not-use"
    access-token-expiration: 900000
    refresh-token-expiration: 604800000

walletcore:
  rabbitmq:
    exchange: walletcore.exchange
    queues:
      notification: walletcore.notification
      notification-dlq: walletcore.notification.dlq
    routing-keys:
      notification: notification.created
  rate-limit:
    transfer:
      capacity: 100
      refill-tokens: 100
      refill-duration-minutes: 1

logging:
  level:
    com.walletcore: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN
